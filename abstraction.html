<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extensive Abstraction — The Concept of Nature</title>
<style>
:root{--paper:#faf8f3;--ink:#1b2430;--accent:#6d4aff;--soft:#e8e3d8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,serif;background:var(--paper);color:var(--ink);line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:2rem 1.5rem}
a.back{font-family:sans-serif;font-size:.85rem;color:var(--accent);text-decoration:none}
h1{font-weight:normal;margin:.5rem 0 .2rem}
.claimbox{background:#fff;border-left:4px solid var(--accent);padding:1rem 1.2rem;margin:1.2rem 0;font-style:italic}
.pid{font-family:sans-serif;font-size:.75rem;background:var(--soft);padding:.1rem .4rem;border-radius:3px;cursor:pointer}
.pid:hover{background:var(--accent);color:#fff}
.zoomstage{background:#fff;border:1px solid var(--soft);height:280px;position:relative;overflow:hidden;margin:1rem 0}
.nest{position:absolute;border:2px solid var(--accent);background:rgba(109,74,255,.06);transition:all .5s;border-radius:50%}
.limit{position:absolute;width:8px;height:8px;background:var(--ink);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .5s}
.qbar{height:18px;background:var(--soft);border-radius:9px;margin:1rem 0;position:relative;overflow:hidden}
.qfill{height:100%;background:var(--accent);width:0%;transition:width .5s}
.qlabel{font-family:sans-serif;font-size:.78rem;color:#777;margin-bottom:.3rem}
.controls{display:flex;flex-wrap:wrap;gap:1.5rem;margin:1rem 0;font-family:sans-serif;font-size:.85rem}
.controls label{display:block;color:#777;margin-bottom:.2rem}
input[type=range]{width:260px}
.toggles{margin:1rem 0;font-family:sans-serif;font-size:.85rem}
.tbtn{border:1px solid var(--ink);background:none;padding:.3rem .8rem;cursor:pointer;margin-right:.5rem}
.tbtn.on{background:var(--ink);color:var(--paper)}
.note{border:1px solid var(--soft);background:#fff;padding:1rem 1.2rem;margin:1rem 0;font-size:.95rem}
.greeknote{display:none;border-left:4px double var(--accent);background:#f4f0ff;padding:1rem 1.2rem;margin:1rem 0;font-size:.95rem}
.modal{display:none;position:fixed;inset:0;background:rgba(27,36,48,.6);align-items:center;justify-content:center}
.modal .box{background:var(--paper);max-width:640px;max-height:80vh;overflow:auto;padding:2rem;border-radius:6px}
.modal .close{float:right;cursor:pointer;font-family:sans-serif}
footer{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--soft);font-size:.8rem;color:#777;font-family:sans-serif}
footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; Home</a>
<h1 data-i18n="title"></h1>
<div class="claimbox"><span data-i18n="claim"></span>
<br><small><span class="pid" data-pid="ch4-p029">ch4-p029</span></small></div>

<div class="zoomstage" id="stage"></div>
<div class="qlabel" data-i18n="qlab"></div>
<div class="qbar"><div class="qfill" id="qfill"></div></div>

<div class="controls">
<div><label data-i18n="zl"></label><input type="range" id="zoom" min="0" max="100" value="0"></div>
</div>

<div class="toggles">
<button class="tbtn on" id="t-real" data-i18n="breal"></button>
<button class="tbtn" id="t-greek" data-i18n="bgreek"></button>
</div>

<div class="note" id="note-real">
<b data-i18n="nrt"></b><p data-i18n="nrx"></p>
<small><span class="pid" data-pid="ch4-p016">ch4-p016</span> · <span class="pid" data-pid="ch4-p022">ch4-p022</span> · <span class="pid" data-pid="ch4-p034">ch4-p034</span></small>
</div>
<div class="greeknote" id="greek">
<b data-i18n="gkt"></b><p data-i18n="gkx"></p>
<small><span class="pid" data-pid="ch9-p024">ch9-p024</span></small>
</div>

<footer>The Concept of Nature · Module III · <a href="https://github.com/jonason92/whitehead-concept-of-nature">GitHub repo</a></footer>
</div>
<div class="modal" id="modal"><div class="box">
<span class="close" id="mclose">&#10005;</span>
<h3 id="modalpid" style="font-family:sans-serif"></h3>
<div id="modaltext" style="margin-top:1rem"></div>
</div></div>
<script>
const I18N={
en:{title:"From Event to Point — The Zoom of Extensive Abstraction",
claim:"Points are not building-blocks of nature but idealizations: abstractive sets converge to limit-formations (event-particles) which idealize simplicity without ever realizing it. The abstract carries exactness; the real remains complex.",
qlab:"convergence of the quantitative expression-series q(e) towards the ideal limit",
zl:"zoom into the abstractive set (e1, e2, e3, ...)",
breal:"actual events (real)",bgreek:"Greek point note (alternative view)",
nrt:"Nested events, converging",
nrx:"Drag the slider: each step selects a smaller event nested inside the previous ones — a set with no last member. The event-series itself converges to nothing; but the relations grow ever simpler, approaching an ideal simplicity no actual event possesses.",
gkt:"Alternative view: the Greek concept of a point",
gkx:"Against the approximative tradition, the Greek definition (Euclid: a point is that which has no part) takes the point as primary and indivisible, not as the end-product of a nested approach. Whitehead honors this note — held beside his method, not merged with it."},
de:{title:"Vom Ereignis zum Punkt — Der Zoom der extensiven Abstraktion",
claim:"Punkte sind keine Urbausteine der Natur, sondern Idealisierungen: Abstraktionsmengen konvergieren gegen Grenzgebilde (Ereignisteilchen), die Einfachheit idealisieren, ohne sie je zu realisieren. Das Abstrakte trägt die Exaktheit; das Reale bleibt komplex.",
qlab:"Konvergenz der quantitativen Ausdrucksserie q(e) gegen das ideale Grenzgebilde",
zl:"hineinzoomen in die Abstraktionsmenge (e1, e2, e3, ...)",
breal:"tatsächliche Ereignisse (real)",bgreek:"Greek-Point-Notiz (Gegensicht)",
nrt:"Geschachtelte Ereignisse, konvergierend",
nrx:"Zieh den Regler: Jeder Schritt wählt ein kleineres, im vorherigen geschachteltes Ereignis — eine Menge ohne letztes Glied. Die Ereignisserie selbst konvergiert gegen nichts; aber die Relationen werden immer einfacher und nähern sich einer idealen Einfachheit, die kein tatsächliches Ereignis besitzt.",
gkt:"Gegensicht: der griechische Punktbegriff",
gkx:"Gegen die approximative Tradition setzt die griechische Definition (Euklid: ein Punkt ist, was keine Teile hat) den Punkt als Primäres und Unteilbares, nicht als Endprodukt genäherter Schachtelung. Whitehead ehrt diese Notiz — neben seine Methode gehalten, nicht mit ihr verschmolzen."}};

function setLang(l){document.documentElement.lang=l;
document.querySelectorAll('[data-i18n]').forEach(el=>{if(I18N[l][el.dataset.i18n])el.textContent=I18N[l][el.dataset.i18n]});
localStorage.setItem('wcn-lang',l);}
setLang(localStorage.getItem('wcn-lang')||'en');

const stage=document.getElementById('stage');
const LAYERS=7;
for(let i=0;i<LAYERS;i++){
const d=document.createElement('div');d.className='nest';d.id='n'+i;stage.appendChild(d);}
const lim=document.createElement('div');lim.className='limit';lim.id='lim';stage.appendChild(lim);

const zoom=document.getElementById('zoom'),qfill=document.getElementById('qfill');
function render(){
const t=zoom.value/100;
for(let i=0;i<LAYERS;i++){
const f=Math.pow(0.62,i+t*5.5);
const d=document.getElementById('n'+i);
const w=Math.min(96,240*f),h=Math.min(88,200*f);
d.style.width=w+'%';d.style.height=h+'%';
d.style.left=((100-w)/2)+'%';d.style.top=((100-h)/2)+'%';
d.style.opacity=Math.max(0.08,1-t*0.85+i*0.06);
}
lim.style.opacity=t>0.85?((t-0.85)/0.15):0;
qfill.style.width=t*100+'%';
}
zoom.oninput=render;
document.getElementById('t-greek').onclick=()=>{const g=document.getElementById('greek');const b=document.getElementById('t-greek');const on=g.style.display!=='block';g.style.display=on?'block':'none';b.classList.toggle('on',on);};
render();

const modal=document.getElementById('modal');let CORPUS=null;
fetch('data/corpus.json').then(r=>r.json()).then(d=>CORPUS=d);
document.addEventListener('click',e=>{
if(!e.target.classList.contains('pid'))return;
const pid=e.target.dataset.pid;if(!CORPUS)return;
for(const ch of (CORPUS.chapters||[]).concat(CORPUS.notes||[])){const p=ch.paragraphs.find(x=>x.pid===pid);
if(p){document.getElementById('modalpid').textContent=pid+' — '+ch.title;
document.getElementById('modaltext').textContent=p.text;modal.style.display='flex';return;}}});
document.getElementById('mclose').onclick=()=>modal.style.display='none';
modal.onclick=e=>{if(e.target===modal)modal.style.display='none'};
</script>
</body>
</html>
